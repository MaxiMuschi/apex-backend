# Deploy The Study Journal (static site) to GitHub Pages.
# After the first run, enable Pages in repo Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        # The site is already static; copy the files Pages should serve into ./_site.
        run: |
          mkdir -p _site
          cp index.html styles.css app.js curriculum.js _site/
          # README is handy at the root of the published site too.
          cp README.md _site/ 2>/dev/null || true

      - name: Sanity check JS
        run: |
          node --check _site/app.js
          node --check _site/curriculum.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
